<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaizen Store</title>
<meta property="og:title" content="Kaizen Store">
<meta property="og:site_name" content="Kaizen Store">
<meta property="og:description" content="Perfumes, camisetas y lentes. Elige y pide por WhatsApp.">
<meta name="description" content="Perfumes, camisetas y lentes. Elige y pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#10212B; --muted:#5B6B73;
  --line:#D9E1DE; --accent:#0F766E; --accent-ink:#FFFFFF; --tag:#E2EFEC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F; --surface:#15262D; --ink:#EAF2F0; --muted:#98AAB1;
    --line:#2A3E46; --accent:#3FB8AA; --accent-ink:#06201D; --tag:#1C3A3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15262D; --ink:#EAF2F0; --muted:#98AAB1;
  --line:#2A3E46; --accent:#3FB8AA; --accent-ink:#06201D; --tag:#1C3A3A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:48px 0 28px}
h1{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;margin:0 0 10px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:46ch}
.brand{display:flex;align-items:center;gap:18px}
.firma{display:inline-block;margin:0 0 10px;padding:3px 14px;border-radius:999px;background:#161616;color:#FFFFFF;font-size:1rem;font-weight:700}
.topbar{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--surface);border-bottom:1px solid var(--line);transform:translateY(-100%);visibility:hidden;cursor:pointer}
.topbar.show{transform:none;visibility:visible}
.mono{width:38px;height:38px;border-radius:50%;background:#161616;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:1.1rem;line-height:1}
.mono b{font-weight:800}
.mono b+b{margin-left:-.12em}
.topbar span{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:800;font-size:1.15rem}
.card.pre{opacity:0;transform:translateY(18px)}
.card.pre.in{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){.topbar{transition:transform .3s ease,visibility .3s}.card{transition:opacity .55s ease,transform .55s ease}}
.logo{width:clamp(72px,16vw,108px);height:auto;aspect-ratio:1;border-radius:50%;flex:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0 22px;border-bottom:1px solid var(--line)}
.tools input{flex:1 1 220px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:26px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/3;display:grid;place-items:center;font-size:3.4rem;background:var(--tag)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.85rem;color:var(--muted)}
.name{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:600;font-size:1.15rem;line-height:1.2;margin:0}
.desc{font-size:.93rem;color:var(--muted);margin:0}
.row{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:800;font-size:1.4rem}
.buy{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:9px 14px;border-radius:10px;font-size:.93rem}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}
button.buy{border:0;font-family:inherit;font-weight:600;font-size:.93rem;cursor:pointer}
.buy.full{width:100%;padding:11px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.step button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font-size:1.1rem;cursor:pointer}
.step .sn{min-width:28px;text-align:center;font-weight:600}
.may{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem}
.may b{font-weight:600;color:var(--accent)}
.may span{background:var(--tag);border-radius:6px;padding:2px 8px}
.was{font-family:Figtree,system-ui,sans-serif;font-size:.9rem;font-weight:400;color:var(--muted);margin-right:6px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.fab b{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.85rem;padding:0 6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;visibility:hidden}
.scrim.open{opacity:1;visibility:visible}
.cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:40;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:1px solid var(--line)}
.cart.open{transform:none;visibility:visible}
.ch{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-family:"Bricolage Grotesque",Georgia,sans-serif;font-size:1.3rem}
.x{background:none;border:0;color:var(--ink);font-size:1.3rem;cursor:pointer;padding:6px 10px}
.cl{flex:1;overflow-y:auto;padding:6px 18px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it .n{font-weight:600}
.it .s{font-weight:600;text-align:right}
.it .u{color:var(--muted);font-size:.9rem}
.q{display:flex;align-items:center;gap:8px;margin-top:6px}
.q button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.1rem;cursor:pointer}
.q .del{width:auto;padding:0 10px;font-size:.85rem;color:var(--muted)}
.cf{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;font-size:1.2rem}
.send{background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;font-weight:600;padding:13px;border-radius:12px}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.clr{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.cart{transition:transform .25s,visibility .25s}.scrim{transition:opacity .25s,visibility .25s}}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:.93rem}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.buy{transition:filter .15s}.buy:hover{filter:brightness(1.1)}}
@media (max-width:640px){
  .wrap{padding:0 12px}
  header{padding:28px 0 18px}
  .grid{gap:8px;padding:18px 0 90px}
  .pic{font-size:2rem}
  .body{padding:8px 8px 10px;gap:4px}
  .cat,.desc{display:none}
  .name{font-size:.78rem;line-height:1.2}
  .price{font-size:1rem}
  .was{display:block;margin:0;font-size:.7rem}
  .row{flex-direction:column;align-items:stretch;gap:6px;padding-top:6px}
  .step{justify-content:space-between}
  .step button{width:28px;height:30px}
  .buy.full{padding:8px 4px;font-size:.78rem}
  .may{flex-direction:column;align-items:flex-start;gap:3px;font-size:.66rem}
  .may span{padding:1px 5px}
}
</style>
</head>

}
function unitPrice(p, q){ var pr = p.precio; (p.mayor || []).forEach(function(t){ if(q >= t[0]) pr = t[1]; }); return pr; }
function mayorHtml(p){
  if(!p.mayor || !p.mayor.length) return "";
  return '<div class="may"><b>Al mayor</b>' + p.mayor.map(function(t){ return '<span>' + t[0] + ' o más: ' + money(t[1]) + ' c/u</span>'; }).join("") + '</div>';
}
function hint(p, q){
  var next = (p.mayor || []).filter(function(t){ return q < t[0]; })[0];
  var applied = unitPrice(p, q) < p.precio;
  return (applied ? ' (precio al mayor)' : '') + (next ? '<br>Lleva ' + next[0] + ' y paga ' + money(next[1]) + ' c/u' : '');
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function chips(){
  var cats = ["Todos"];
  PRODUCTOS.forEach(function(p){ if(cats.indexOf(p.categoria) < 0) cats.push(p.categoria); });
  $chips.innerHTML = "";
  cats.forEach(function(c){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", c === cat);
    b.onclick = function(){ cat = c; chips(); draw(); };
    $chips.appendChild(b);
  });
}

function draw(){
  var list = PRODUCTOS.filter(function(p){
    var okCat = cat === "Todos" || p.categoria === cat;
    var okTerm = !term || (p.nombre + " " + p.desc).toLowerCase().indexOf(term) >= 0;
    return okCat && okTerm;
  });
  if(!list.length){ $grid.innerHTML = '<p class="empty">No encontramos productos con esa búsqueda. Prueba con otra palabra o elige otra categoría.</p>'; return; }
  $grid.innerHTML = list.map(function(p){
    var msg = encodeURIComponent("Hola, me interesa: " + p.nombre + " (" + money(p.precio) + ")");
    var pic = p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.nombre) + '" loading="lazy">' : '<span aria-hidden="true">' + p.emoji + '</span>';
    return '<article class="card"><div class="pic">' + pic + '</div><div class="body">' +
      '<span class="cat">' + esc(p.categoria) + '</span>' +
      '<h2 class="name">' + esc(p.nombre) + '</h2>' +
      '<p class="desc">' + esc(p.desc) + '</p>' +
      mayorHtml(p) +
      '<div class="row"><span class="price">' + money(p.precio) + '</span>' +
      '<div class="step"><button data-s="-" aria-label="Menos unidades">−</button><span class="sn" aria-live="polite">1</span><button data-s="+" aria-label="Más unidades">+</button></div></div>' +
      '<button class="buy full" data-n="' + esc(p.nombre) + '">Agregar</button>' +
      '</div></article>';
  }).join("");
  if(typeof cart !== "undefined" && cart) refreshAll();
  reveal();
}

document.getElementById("q").addEventListener("input", function(e){ term = e.target.value.trim().toLowerCase(); draw(); });
chips(); draw();

/* ---------- Carrito ---------- */
var cart = {};
try { var sv = JSON.parse(localStorage.getItem("kaizen_cart") || "{}"); Object.keys(sv).forEach(function(k){ if(find(k)) cart[k] = sv[k]; }); } catch(e){}
function find(n){ return PRODUCTOS.filter(function(p){ return p.nombre === n; })[0]; }
function save(){ try { localStorage.setItem("kaizen_cart", JSON.stringify(cart)); } catch(e){} }
var $cart = document.getElementById("cart"), $scrim = document.getElementById("scrim");
function openCart(o){ $cart.classList.toggle("open", o); $scrim.classList.toggle("open", o); }
document.getElementById("fab").onclick = function(){ openCart(true); };
document.getElementById("cx").onclick = $scrim.onclick = function(){ openCart(false); };
document.addEventListener("keydown", function(e){ if(e.key === "Escape") openCart(false); });

function refreshCard(card){
  var b = card.querySelector(".buy"); if(!b) return;
  var k = b.dataset.n, p = find(k); if(!p) return;
  var sel = parseInt(card.querySelector(".sn").textContent, 10) || 1;
  var up = unitPrice(p, (cart[k] || 0) + sel);
  card.querySelector(".price").innerHTML = up < p.precio ? '<s class="was">' + money(p.precio) + '</s>' + money(up) : money(p.precio);
}
var revealIO;
function reveal(){
  if(!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!revealIO) revealIO = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); revealIO.unobserve(e.target); } });
  }, {threshold:.1});
  Array.prototype.forEach.call(document.querySelectorAll(".card:not(.pre)"), function(c, i){
    c.style.transitionDelay = ((i % 3) * 90) + "ms";
    c.classList.add("pre"); revealIO.observe(c);
  });
}
function refreshAll(){ Array.prototype.forEach.call(document.querySelectorAll(".card"), refreshCard); }

function renderCart(){
  var names = Object.keys(cart), n = 0, total = 0;
  var html = names.map(function(k){
    var p = find(k), q = cart[k], up = unitPrice(p, q); n += q; total += up * q;
    var a = esc(k);
    return '<div class="it"><div><div class="n">' + a + '</div><div class="u">' + money(up) + ' c/u' + hint(p, q) + '</div>' +
      '<div class="q"><button data-a="m" data-n="' + a + '" aria-label="Quitar uno">−</button><span>' + q + '</span>' +
      '<button data-a="p" data-n="' + a + '" aria-label="Agregar uno">+</button>' +
      '<button class="del" data-a="d" data-n="' + a + '">Eliminar</button></div></div>' +
      '<div class="s">' + money(up * q) + '</div></div>';
  }).join("");
  document.getElementById("cl").innerHTML = html || '<p class="empty" style="padding:24px 0">Tu carrito está vacío. Agrega productos desde el catálogo.</p>';
  document.getElementById("fabn").textContent = n;
  document.getElementById("tot").textContent = money(total);
  var lines = names.map(function(k){ var p = find(k); return "• " + cart[k] + " x " + k + " (" + money(unitPrice(p, cart[k]) * cart[k]) + ")"; });
  var msg = "Hola " + NEGOCIO + ", quiero hacer este pedido:\n" + lines.join("\n") + "\n\nTotal: " + money(total);
  var s = document.getElementById("send");
  s.href = names.length ? "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg) : "#";
  s.setAttribute("aria-disabled", names.length ? "false" : "true");
  save(); refreshAll();
}

$grid.addEventListener("click", function(e){
  var st = e.target.closest("[data-s]");
  if(st){ var sn = st.closest(".card").querySelector(".sn"); var v = parseInt(sn.textContent, 10) + (st.dataset.s === "+" ? 1 : -1); sn.textContent = Math.max(1, Math.min(99, v)); refreshCard(st.closest(".card")); return; }
  var b = e.target.closest(".buy"); if(!b) return;
  var sn2 = b.closest(".card").querySelector(".sn"), add = parseInt(sn2.textContent, 10) || 1;
  var k = b.dataset.n; cart[k] = (cart[k] || 0) + add; sn2.textContent = "1"; renderCart();
  b.textContent = "Agregado ✓"; setTimeout(function(){ b.textContent = "Agregar"; }, 900);
});
document.getElementById("cl").addEventListener("click", function(e){
  var b = e.target.closest("button[data-a]"); if(!b) return;
  var k = b.dataset.n, a = b.dataset.a;
  if(a === "p") cart[k]++;
  else if(a === "m") { cart[k]--; if(cart[k] <= 0) delete cart[k]; }
  else delete cart[k];
  renderCart();
});
document.getElementById("clr").onclick = function(){ cart = {}; renderCart(); };

/* ---------- Barra con el nombre al bajar ---------- */
(function(){
  var hdr = document.querySelector("header"), bar = document.getElementById("topbar");
  
  bar.onclick = function(){ window.scrollTo({top:0, behavior:"smooth"}); };
  function set(show){ bar.classList.toggle("show", show); bar.setAttribute("aria-hidden", show ? "false" : "true"); }
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(es){ set(!es[0].isIntersecting); }, {threshold:0}).observe(hdr);
  } else {
    window.addEventListener("scroll", function(){ set(hdr.getBoundingClientRect().bottom < 0); });
  }
})();
renderCart();
</script>
</body>
</html>
